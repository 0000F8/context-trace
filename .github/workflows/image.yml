name: Server image

# Only fires on version tags. A plain push to main never publishes an image.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/context-trace-server"
          tags="${image}:${version}"
          # Semver prerelease = a hyphen after the numeric core (0.3.0-rc1,
          # 0.3.0-beta.1). Only a real release may move `latest` — a
          # pre-release tag must never repoint it.
          case "$version" in
            *-*) ;;
            *) tags="${tags}"$'\n'"${image}:latest" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Build from the repo root context — the server Dockerfile needs the
      # root lockfile and the workspace package.jsons (see server/Dockerfile).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
