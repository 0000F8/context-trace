name: Release

# Manual only. Nothing in this repo publishes on push, tag, or PR — see
# image.yml for the one exception (container images on `v*` tags).
on:
  workflow_dispatch:
    inputs:
      publish_types:
        description: "Publish @context-trace/types to npm"
        type: boolean
        default: true
      publish_sdk:
        description: "Publish @context-trace/sdk to npm"
        type: boolean
        default: true
      publish_langchain:
        description: "Publish @context-trace/langchain to npm"
        type: boolean
        default: true
      publish_pypi:
        description: "Publish context-trace (Python) to PyPI"
        type: boolean
        default: true
      npm_tag:
        description: "npm dist-tag"
        type: choice
        options: ["latest", "next"]
        default: "latest"

permissions:
  contents: read

jobs:
  npm-publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build

      - name: Check for NPM_TOKEN
        id: npmcheck
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set on this repo/fork — skipping all npm publish steps."
            echo "have_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish order matters: types has no workspace deps, sdk depends on
      # types, langchain depends on both. npm resolves them from the
      # workspace during `npm run build`, but the registry itself needs the
      # dependency already published before a dependent package can install
      # cleanly from it.
      - name: Publish @context-trace/types
        if: steps.npmcheck.outputs.have_token == 'true' && inputs.publish_types
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w @context-trace/types --tag "${{ inputs.npm_tag }}" --access public

      - name: Publish @context-trace/sdk
        if: steps.npmcheck.outputs.have_token == 'true' && inputs.publish_sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w @context-trace/sdk --tag "${{ inputs.npm_tag }}" --access public

      - name: Publish @context-trace/langchain
        if: steps.npmcheck.outputs.have_token == 'true' && inputs.publish_langchain
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w @context-trace/langchain --tag "${{ inputs.npm_tag }}" --access public

      - name: Skipped (no NPM_TOKEN)
        if: steps.npmcheck.outputs.have_token == 'false'
        run: echo "npm publish skipped - NPM_TOKEN secret is not configured."

  pypi-publish:
    name: Publish PyPI package
    runs-on: ubuntu-latest
    if: inputs.publish_pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for PYPI_TOKEN
        id: pypicheck
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::warning::PYPI_TOKEN secret is not set on this repo/fork — skipping PyPI publish."
            echo "have_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist and wheel
        if: steps.pypicheck.outputs.have_token == 'true'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build sdk-python --outdir sdk-python/dist

      - name: Upload to PyPI
        if: steps.pypicheck.outputs.have_token == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload sdk-python/dist/*

      - name: Skipped (no PYPI_TOKEN)
        if: steps.pypicheck.outputs.have_token == 'false'
        run: echo "PyPI publish skipped - PYPI_TOKEN secret is not configured."
