server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /api/v1/* -> server /v1/* (trailing slash strips the /api/ prefix)
  location /api/ {
    proxy_pass http://server:4720/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
