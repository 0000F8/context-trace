server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Trace content is attacker-controllable via open ingest; these headers are
  # the second layer behind React's escaping.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # SSE live tail: no buffering, long read timeout. Must precede the generic
  # /api/ block (regex locations win over the prefix match).
  location ~ ^/api/v1/sessions/[^/]+/live$ {
    rewrite ^/api(.*)$ $1 break;
    proxy_pass http://server:4720;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # /api/v1/* -> server /v1/* (trailing slash strips the /api/ prefix)
  location /api/ {
    proxy_pass http://server:4720/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
