[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-trace"
version = "0.1.0"
description = "Zero-dependency Python client for capturing LLM context assemblies and shipping them to a context-trace server."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
